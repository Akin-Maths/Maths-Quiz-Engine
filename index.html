<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Maths Quiz Engine — Year 11 Set 2</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --ink: #1c1c1a;
    --paper: #f2f1ec;
    --line: #c9c7bd;
    --accent: #2f5d50;
    --muted: #6b6a63;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  }
  body {
    display: flex;
    justify-content: center;
    padding: 64px 24px 96px;
  }
  main {
    width: 100%;
    max-width: 640px;
  }
  header {
    border-bottom: 1px solid var(--line);
    padding-bottom: 20px;
    margin-bottom: 40px;
  }
  h1 {
    font-size: 1.9rem;
    font-weight: 600;
    margin: 0 0 6px;
    line-height: 1.25;
  }
  .subtitle {
    color: var(--muted);
    font-size: 1rem;
    margin: 0;
  }
  .set-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .set-list li {
    border-bottom: 1px solid var(--line);
  }
  .set-list li:first-child {
    border-top: 1px solid var(--line);
  }
  .quiz-link {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 4px;
    text-decoration: none;
    color: var(--ink);
  }
  .quiz-link:hover .quiz-name {
    color: var(--accent);
  }
  .quiz-name {
    font-size: 1.15rem;
  }
  .quiz-meta {
    font-family: "Courier New", monospace;
    font-size: 0.85rem;
    color: var(--muted);
    white-space: nowrap;
  }
  footer {
    margin-top: 48px;
    color: var(--muted);
    font-size: 0.9rem;
    font-style: italic;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Maths Quiz Engine</h1>
    <p class="subtitle">Year 11 Set 2 — parametrised quizzes, aligned to the scheme of work</p>
  </header>

  <ul class="set-list">
    <li>
      <a class="quiz-link" href="quiz_engine_35.html">
        <span class="quiz-name">Quiz 35</span>
        <span class="quiz-meta">quiz_engine_35.html</span>
      </a>
    </li>
    <li>
      <a class="quiz-link" href="quiz_engine_34.html">
        <span class="quiz-name">Quiz 34</span>
        <span class="quiz-meta">quiz_engine_34.html</span>
      </a>
    </li>
  </ul>

  <footer>Add a new line above each time a quiz version goes live.</footer>
</main>
</body>
</html>
